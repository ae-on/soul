- id: tribal
  title: "🔥 Трайбл фьюжн (Tribal Fusion)"
  description: "Новый виток развития восточного танца. Это медитативность, поиск себя и искусное владение телом. Техника сочетает элементы восточного, испанского, индийского и других танцев, предоставляя большую свободу для самовыражения."
  url: "http://soul.by/index.php/tribal/"

- id: oriental
  title: "🩰 Восточный танец (Беллиданс)"
  description: "Древнейшая танцевальная техника, которая помогает раскрыть женственность, мягкость и сексуальность. Учит находить баланс между напряжением и расслаблением, избавляет от последствий стресса."
  url: "http://soul.by/index.php/vostocniy-tanec/"

- id: yoga
  title: "🧘 Йога"
  description: "Практика, направленная на оздоровление организма, поиск его скрытых возможностей и создание правильного умственного и эмоционального настроя. В студии преподают хатха-йогу, адаптированную к нуждам современного человека."
  url: "http://soul.by/index.php/yoga-minsk/"

- id: bachata
  title: "💃 Бачата (для пар)"
  description: "Бачата — это диалог тел, разговор без слов. В студии предлагают уникальный формат, где пары проходят весь путь обучения вместе, не меняя партнёров. Это идеальный способ укрепить отношения, раскрыть новый уровень доверия и гармонии, а также устроить необычное свидание. Обучение ведётся с нуля в комфортной и дружеской атмосфере."
  url: "https://soul.by/bachata-minsk/"

- id: qigong
  title: "🌿 Цигун"
  description: "«Ци» — поток жизненной энергии, «Гун» — работа. Это система плавных, контролируемых движений, управления дыханием и вниманием, выросшая из китайской народной медицины. Занятия цигун наполняют энергией, дарят здоровье и долголетие, а также способствуют спокойствию ума и внутреннему равновесию."
  url: "https://soul.by/cigun-minsk/"

- id: indian
  title: "🇮🇳 Индийский танец"
  description: "Индийский танец — это не просто искусство, а духовная практика, воплощающая древнюю мудрость. Подобно йоге, он способен погрузить танцора в состояние транса, раскрывая внутреннюю сущность. В студии преподают как классический индийский танец, так и современный и яркий стиль «Болливуд», а также другие стили: Гарба, Дандия, Лавани и Бхангра."
  url: "https://soul.by/indian-dance-minsk/"

- id: historical
  title: "🏛️ Исторический танец"
  description: "Это прекрасная возможность погрузиться в миры любимых книг и фильмов, узнать много нового об истории и культуре, завести интересные знакомства. Значительную часть исторических танцев можно танцевать без особенной физической подготовки, ведь они были придуманы для того, чтобы совершенно обычные люди могли весело и интересно провести вечер. Вас ожидает: изучение схем танцев из исторических сборников, освоение нескольких видов вальса, участие в балах и пикниках, основы бального этикета."
  url: "https://soul.by/historical-dance/"

- id: pilates
  title: "🧘 Пилатес"
  description: "Пилатес — это уникальная система физических упражнений, которая направлена на оздоровление организма и восстановление естественного положения тела в пространстве. Это одна из наиболее щадящих форм воздействия на организм, разработанная для реабилитации людей после травм позвоночника, поэтому она не имеет практически никаких противопоказаний. Пилатес доступен людям любого уровня подготовки. Занятия включают работу с основными принципами пилатеса: концентрация, мышечный контроль, правильное дыхание, плавность движений, а также проработку глубинных мышц, служащих «каркасом» для позвоночника."
  url: "https://soul.by/pilates/"

